<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | InfinityArtWorld</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
    <a href="index.html" class="logo">Infinity<span>ArtWorld</span></a>

    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="index.html#categories">Categories</a>
        <a href="index.html#about">About</a>
    </nav>

    <div class="nav-actions">
        <a href="cart.html" class="cart-btn">
            🛒 Cart (<span id="cart-count">0</span>)
        </a>
    </div>
</header>

<main>

<section class="checkout">

    <h1>Checkout</h1>

    <form id="checkout-form">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="address">Shipping Address</label>
            <textarea id="address" name="address" required></textarea>
        </div>

        <div class="form-group">
            <label for="payment-method">Payment Method</label>
            <select id="payment-method" name="payment-method" required>
                <option value="credit-card">Credit Card</option>
                <option value="paypal">PayPal</option>
                <option value="bank-transfer">Bank Transfer</option>
            </select>
        </div>

        <button type="submit" class="checkout-btn">Complete Purchase</button>
    </form>

    <a href="cart.html" class="back-cart">← Back to Cart</a>
</section>

</main>

<footer>
    <a href="index.html" class="logo">Infinity<span>ArtWorld</span></a>
    <p>Handmade art • Infinite creativity</p>
    <p class="copyright">© 2026 InfinityArtWorld</p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
