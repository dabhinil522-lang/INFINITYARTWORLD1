<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | InfinityArtWorld</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
    <a href="index.html" class="logo">Infinity<span>ArtWorld</span></a>

    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="index.html#categories">Categories</a>
        <a href="index.html#about">About</a>
    </nav>

    <div class="nav-actions">
        <a href="cart.html" class="cart-btn">
            🛒 Cart (<span id="cart-count">0</span>)
        </a>
    </div>
</header>

<main>

<section class="cart-details">
    <h1>Your Shopping Cart</h1>
    <div id="cart-items">
        <!-- Cart items will be dynamically inserted here -->
    </div>

    <div class="cart-summary">
        <div class="total-price">
            <strong>Total:</strong> <span id="total-price">₹0</span>
        </div>
        <button onclick="proceedToCheckout()" class="checkout-btn">Proceed to Checkout</button>
    </div>
</section>

</main>

<footer>
    <a href="index.html" class="logo">Infinity<span>ArtWorld</span></a>
    <p>Handmade art • Infinite creativity</p>
    <p class="copyright">© 2026 InfinityArtWorld</p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
