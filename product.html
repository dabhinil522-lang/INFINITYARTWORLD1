<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product | InfinityArtWorld</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
    <a href="index.html" class="logo">Infinity<span>ArtWorld</span></a>

    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="index.html#categories">Categories</a>
        <a href="index.html#about">About</a>
    </nav>

    <div class="nav-actions">
        <a href="cart.html" class="cart-btn">
            🛒 Cart (<span id="cart-count">0</span>)
        </a>
    </div>
</header>

<main>

<section class="product-details">

    <div class="product-details-image">
        <img id="product-image" src="" alt="Product">
    </div>

    <div class="product-details-info">

        <p class="eyebrow" id="product-category">ART</p>

        <h1 id="product-name">Product</h1>

        <div class="product-rating">
            ⭐⭐⭐⭐⭐
            <span>Handmade with love</span>
        </div>

        <div class="product-price" id="product-price">₹0</div>

        <p class="product-description" id="product-description"></p>

        <div class="product-feature">
            <p>✓ Handmade</p>
            <p>✓ Carefully crafted</p>
            <p>✓ Perfect for gifting</p>
            <p>✓ Custom orders available</p>
        </div>

        <div class="product-quantity">
            <button onclick="changeProductQuantity(-1)">−</button>
            <span id="product-quantity">1</span>
            <button onclick="changeProductQuantity(1)">+</button>
        </div>

        <button class="product-add-btn" onclick="addProductToCart()">
            🛒 Add to Cart
        </button>

        <a href="shop.html" class="back-shop">← Back to Shop</a>
    </div>

</section>

</main>

<footer>
    <a href="index.html" class="logo">Infinity<span>ArtWorld</span></a>
    <p>Handmade art • Infinite creativity</p>
    <p class="copyright">© 2026 InfinityArtWorld</p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
